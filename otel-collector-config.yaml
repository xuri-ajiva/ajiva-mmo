receivers:
  otlp:
    protocols:
      grpc:
      http

exporters:
  prometheus:
    endpoint: "0.0.0.0:9464"  # Prometheus scrapes here

  logging:
    loglevel: debug

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [logging]   # just log traces for now
    metrics:
      receivers: [otlp]
      exporters: [prometheus]
